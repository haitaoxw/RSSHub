name: LinuxDo live RSS

on:
    push:
        branches:
            - agent/linuxdo-rss-browser-fallback
        paths:
            - 'lib/routes/discourse/**'
            - 'docker-compose.linuxdo.yml'
            - 'Dockerfile'
            - '.github/workflows/linuxdo-live.yml'
    workflow_dispatch: {}

permissions:
    contents: read

jobs:
    linuxdo-live:
        name: LinuxDo RSS through RSSHub
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Build and start RSSHub with bundled Chromium
              run: docker compose -f docker-compose.linuxdo.yml up -d --build

            - name: Wait for RSSHub health
              shell: bash
              run: |
                  set -euo pipefail
                  for i in $(seq 1 60); do
                    if curl -fsS http://127.0.0.1:1200/healthz >/dev/null; then
                      exit 0
                    fi
                    sleep 2
                  done
                  docker compose -f docker-compose.linuxdo.yml logs rsshub
                  exit 1

            - name: Measure direct Node fetch from the RSSHub container
              shell: bash
              run: |
                  set -euo pipefail
                  docker compose -f docker-compose.linuxdo.yml exec -T rsshub node --input-type=module <<'NODE'
                  const url = 'https://linux.do/c/news/34.rss';
                  const response = await fetch(url, { redirect: 'follow' });
                  const body = await response.text();
                  console.log(JSON.stringify({
                    status: response.status,
                    contentType: response.headers.get('content-type'),
                    length: body.length,
                    head: body.slice(0, 160).replace(/\s+/g, ' '),
                  }, null, 2));
                  NODE

            - name: Verify Chromium can fetch LinuxDo RSS from the same container
              shell: bash
              run: |
                  set -euo pipefail
                  docker compose -f docker-compose.linuxdo.yml exec -T rsshub node --input-type=module <<'NODE'
                  import { chromium } from 'patchright';
                  import fs from 'node:fs';

                  const url = 'https://linux.do/c/news/34.rss';
                  const envFile = fs.existsSync('/app/.env') ? fs.readFileSync('/app/.env', 'utf8') : '';
                  const executablePath = process.env.CHROMIUM_EXECUTABLE_PATH || envFile.match(/^CHROMIUM_EXECUTABLE_PATH=(.+)$/m)?.[1];

                  const browser = await chromium.launch({
                    executablePath,
                    headless: true,
                    args: [
                      '--no-sandbox',
                      '--disable-setuid-sandbox',
                      '--window-position=0,0',
                      '--ignore-certificate-errors',
                      '--ignore-certificate-errors-spki-list',
                    ],
                  });

                  try {
                    const context = await browser.newContext({ ignoreHTTPSErrors: true });
                    const page = await context.newPage();
                    const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
                    if (!response) throw new Error('Chromium returned no response');
                    const body = await response.text();
                    const contentType = response.headers()['content-type'] || '';
                    console.log(JSON.stringify({
                      status: response.status(),
                      contentType,
                      length: body.length,
                      head: body.slice(0, 160).replace(/\s+/g, ' '),
                    }, null, 2));
                    if (response.status() !== 200) throw new Error(`Expected Chromium HTTP 200, got ${response.status()}`);
                    if (!contentType.includes('rss') && !body.includes('<rss')) throw new Error('Chromium response is not RSS');
                  } finally {
                    await browser.close();
                  }
                  NODE

            - name: Verify modified RSSHub route fetches LinuxDo end-to-end
              shell: bash
              run: |
                  set -euo pipefail
                  curl --fail --silent --show-error \
                    --max-time 60 \
                    http://127.0.0.1:1200/discourse/0/official/c/news/34 \
                    --output /tmp/linuxdo-rss.xml

                  python3 - <<'PY'
                  from pathlib import Path
                  import xml.etree.ElementTree as ET

                  path = Path('/tmp/linuxdo-rss.xml')
                  body = path.read_text(encoding='utf-8')
                  root = ET.fromstring(body)
                  items = root.findall('./channel/item')
                  print({
                      'root': root.tag,
                      'bytes': len(body.encode('utf-8')),
                      'items': len(items),
                      'title': root.findtext('./channel/title'),
                  })
                  if root.tag != 'rss':
                      raise SystemExit('RSSHub response root is not <rss>')
                  if not items:
                      raise SystemExit('RSSHub response contains no items')
                  PY

            - name: Show RSSHub fallback evidence
              if: always()
              shell: bash
              run: |
                  docker compose -f docker-compose.linuxdo.yml logs --no-color rsshub | tail -n 300

            - name: Stop containers
              if: always()
              run: docker compose -f docker-compose.linuxdo.yml down -v
